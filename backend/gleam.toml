name = "cube_leaderboard"
version = "1.0.0"
description = "Daily-challenge leaderboard for cube.micutu.com: replays every submitted solve before ranking it"
licences = ["MIT"]
repository = { type = "github", user = "Alexandru2984", repo = "wasm_rubickCube" }
target = "erlang"

[erlang]
# inets (httpd) and crypto ship with OTP; listing them makes the release
# start them and keeps the erlang-shipment self-describing.
extra_applications = ["inets", "crypto"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
