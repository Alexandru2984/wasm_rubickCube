[package]
name = "cube_v2"
version = "0.1.0"
edition = "2021"

[dependencies]
# Doar ce foloseste aplicatia: fereastra + PBR + pipeline WebGL2.
# Setul default de features (audio, glTF, animation, scene, UI, text, gizmos,
# png...) umfla binarul WASM fara niciun beneficiu aici.
bevy = { version = "0.14", default-features = false, features = [
    "bevy_winit",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "webgl2",
    "tonemapping_luts",
    "ktx2",
    "zstd",
] }
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.22.0", features = ["js"] }
bevy_egui = { version = "0.28", default-features = false, features = ["render", "default_fonts"] }
# Solver Kociemba two-phase (pur Rust, compatibil wasm prin wasmtimer).
kewb = "0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# localStorage pentru persistenta starii cubului si a recordului.
web-sys = { version = "0.3", features = ["Window", "Storage"] }
# Panicurile ajung in consola browserului cu stack trace lizibil.
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Pe nativ (cargo test) winit are nevoie de un backend de fereastra.
bevy = { version = "0.14", default-features = false, features = ["x11"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Optimizare dev pentru WASM (fara aceasta, e extrem de lent in browser)
[profile.dev]
opt-level = 1
