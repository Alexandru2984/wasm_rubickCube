# cube.micutu.com — http-context pieces of the vhost. Installed to
# /etc/nginx/conf.d/cube-limits.conf by deploy/install-nginx.sh.
# $binary_remote_addr is the real visitor (cloudflare-realip.conf).

# Leaderboard reads: a board per daily visit, a few refreshes. Generous
# enough for many phones behind one carrier NAT.
limit_req_zone $binary_remote_addr zone=cube_api_read:10m rate=60r/m;

# Leaderboard writes: POST only (an empty key isn't counted, so GETs never
# touch this zone). One solve a day per browser needs very little.
map $request_method $cube_api_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $cube_api_write_key zone=cube_api_write:10m rate=6r/m;

# The site is static except for submitting a daily solve.
map "$request_method:$uri" $cube_method_allowed {
    "~^(GET|HEAD):"            1;
    "~^POST:/api/daily/[0-9]+$" 1;
    default                    0;
}
