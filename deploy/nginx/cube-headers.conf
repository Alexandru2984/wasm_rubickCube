# Security headers for cube.micutu.com — installed to
# /etc/nginx/snippets/cube-headers.conf by deploy/install-nginx.sh.
#
# nginx drops ALL inherited add_header directives as soon as a block declares
# one of its own, so every location that sets a header (Cache-Control, ...)
# must include this file again. The previous vhost lost every security header
# on .js/.wasm/sw.js this way.
#
# CSP: no 'unsafe-inline' anywhere. The Trunk bootstrap is externalized at
# build time (tools/postbuild.py), there are no inline handlers or style
# attributes, and the build fails if one sneaks in. 'wasm-unsafe-eval' is the
# narrow permission WebAssembly compilation needs. The per-request nonce lets
# Cloudflare tag the script it injects at the edge.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'nonce-$request_id' https://analytics.micutu.com https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://analytics.micutu.com https://cloudflareinsights.com; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=(), fullscreen=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
