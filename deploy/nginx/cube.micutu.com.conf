# cube.micutu.com — static WASM app + the daily leaderboard API. Installed to
# /etc/nginx/sites-available/cube.micutu.com-canary by deploy/install-nginx.sh
# (with conf.d/cube-limits.conf, which defines the maps and zones used here).
# Traffic arrives through the Cloudflare tunnel (catch-all → https://127.0.0.1:443).

server {
    listen 80;
    listen [::]:80;
    server_name cube.micutu.com;

    access_log /var/log/nginx/cube-canary.access.log;
    error_log /var/log/nginx/cube-canary.error.log warn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cube.micutu.com;

    # releases/current is swapped atomically by deploy/deploy.sh.
    root /srv/canary/cube.micutu.com/current;
    index index.html;

    access_log /var/log/nginx/cube-canary.access.log;
    error_log /var/log/nginx/cube-canary.error.log warn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cube.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cube.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cube_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Static files take no request bodies and only need GET/HEAD; the one
    # exception is POST /api/daily/<day> (see $cube_method_allowed).
    client_max_body_size 1k;
    if ($cube_method_allowed = 0) {
        return 405;
    }

    # Precompressed .gz (and, for hashed assets, .br) siblings are written
    # at build time; dynamic gzip covers the rest.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css image/svg+xml application/manifest+json application/json text/plain application/xml;

    include /etc/nginx/snippets/cube-headers.conf;

    # Real 404s (no SPA fallback: the app routes with #fragments only, and a
    # missing hashed asset must not come back as HTML with status 200).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        try_files /index.html =404;
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The service worker must always revalidate, or updates never land.
    # (The old /sw.js was served immutable for a year and is still cached at
    # the Cloudflare edge — hence the new URL.)
    location = /service-worker.js {
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Dotfiles (.git, .env, ...) never leave the server. Regex locations
    # match in order, so this one goes first.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Brotli siblings of the hashed assets, reached only by the internal
    # redirect below (a direct request for a .br file is a 404). Served as
    # stored, with the type of the file they encode.
    location ~ "\.br$" {
        internal;
        gzip off;
        gzip_static off;
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Encoding "br" always;
        add_header Vary "Accept-Encoding" always;
        location ~ "\.wasm\.br$" { internal; types { application/wasm br; } }
        location ~ "\.m?js\.br$" { internal; types { application/javascript br; } }
        location ~ "\.css\.br$"  { internal; types { text/css br; } }
        location ~ "\.svg\.br$"  { internal; types { image/svg+xml br; } }
        location ~ "\.json\.br$" { internal; types { application/json br; } }
        # Any other type: not served (return isn't inherited by the above).
        return 404;
    }

    # Content-hashed files never change: the UI bundle dir, Trunk's
    # name-<hash>[_bg].{js,wasm}, the boot-<hash>.mjs written by postbuild,
    # and Trunk's <hash>-initializer.mjs. Clients that take brotli get the
    # .br sibling when there is one ($cube_br_probe, cube-limits.conf);
    # the rest get gzip_static or the file itself.
    location ~ "^/(ui-[0-9a-f]{12}/|[A-Za-z0-9_.-]+-[0-9a-f]{16}(_bg)?\.(wasm|js|mjs|css)$|[0-9a-f]{16}-[A-Za-z0-9_.-]+\.mjs$)" {
        if (-f $request_filename$cube_br_probe) {
            rewrite ^ $uri.br last;
        }
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Daily leaderboard: backend/ (Gleam), loopback only. ^~ keeps the
    # static-file regex locations below from ever matching /api/ paths.
    location ^~ /api/ {
        limit_req zone=cube_api_read burst=30 nodelay;
        limit_req zone=cube_api_write burst=4 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        client_body_buffer_size 16k;

        proxy_pass http://127.0.0.1:8737;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;

        # The service sends Cache-Control: no-store itself.
        include /etc/nginx/snippets/cube-headers.conf;
    }

    # Shared across the micutu.com sites.
    location = /robots.txt {
        alias /srv/canary/shared/robots.txt;
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        log_not_found off;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|webp|txt|xml)$ {
        include /etc/nginx/snippets/cube-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
